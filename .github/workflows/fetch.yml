name: Fetch Data

on:
  schedule:
    # Run daily at 8:15 AM UTC
    - cron: '15 8 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch.yml'

jobs:
  fetch-data:
    name: Fetch Russia Sanctions Data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Fetch data
        id: fetch
        run: |
          # TODO: Implement RU source fetcher
          # Russia sanctions require HTML parsing from mid.ru
          #
          # The gem refuses this source outright — mid.ru serves an
          # anti-bot challenge the scraper cannot pass, and
          # FETCHABLE_SOURCES excludes ru — so this exits nonzero on every
          # run by design. The failure is recorded rather than swallowed:
          # `|| true` alone would let a LATER partial harvest be committed,
          # because a fetch that writes some files and then dies still
          # leaves changes for `git status` to find.
          #
          # The commit step below requires succeeded=true, so nothing
          # reaches the repository unless the fetch itself reported
          # success. That holds without anyone remembering to remove a
          # suffix when the real fetcher lands.
          if bundle exec ammitto fetch ru --format yaml --output-dir processed --verbose; then
            echo "succeeded=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            echo "succeeded=false" >> "$GITHUB_OUTPUT"
            # ONLY the expected refusal is caught. `Ammitto::CLI` sets
            # `exit_on_failure? = true`, so a refusal surfaces as a
            # Thor::Error and exit 1. Anything else -- 127 for a gem that
            # did not install, a Ruby crash, a write failure -- is
            # re-raised so the step actually fails, `failure()` becomes
            # true, and the issue below gets filed. Swallowing every
            # nonzero was the original defect here; catching every nonzero
            # would be the same defect wearing a step output.
            if [ "$status" -ne 1 ]; then
              echo "::error::ru fetch exited ${status}, not the expected refusal (1)"
              exit "$status"
            fi
            echo "RU fetch refused (exit 1); nothing will be committed."
          fi

      - name: Check for changes
        id: check_changes
        run: |
          set -euo pipefail
          # Assign first. Inside `[ -z "$(git status)" ]` a failing
          # git -- a broken checkout, a bad index -- yields an empty
          # string, which reads as "no changes" and exits 0. That is
          # another quiet no-commit path, which is what this whole file
          # is about. Under `set -e` a failed assignment fails the step.
          changes="$(git status --porcelain)"
          if [ -z "$changes" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.fetch.outputs.succeeded == 'true' &&
          steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update Russia sanctions data ($(date +%Y-%m-%d))"
          git push

      # `failure()` is true only when a step actually failed. The fetch
      # step above catches its own nonzero exit, so today's by-design RU
      # refusal raises nothing here and files no issue. Keying this on
      # `succeeded != 'true'` instead would open an issue every day for a
      # source already known not to work. When a real fetcher lands and a
      # refusal stops being the expected outcome, this condition is the
      # line that has to change.
      - name: Create issue on failure
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Fetch failed - ${{ github.run_id }}',
              body: 'The fetch workflow failed. See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              labels: ['automation', 'fetch']
            })
