name: Python extraction prototype

on:
  pull_request:
    paths:
      - 'scripts/*.py'
      - 'tests/**'
      - 'reference-docs/announcements/**'
      - '.github/workflows/python-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/*.py'
      - 'tests/**'
      - 'reference-docs/announcements/**'
      - '.github/workflows/python-prototype.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test review-candidate extraction
        run: python3 -m unittest discover -s tests -v
      - name: Exercise the saved reference corpus
        run: python3 scripts/extract_review_candidates.py --source-root . --output-dir "${{ runner.temp }}/ru-review-candidates"
