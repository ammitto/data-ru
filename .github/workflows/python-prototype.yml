name: RU extraction and import review

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'processed/**'
      - 'schemas/**'
      - 'lib/**'
      - 'spec/**'
      - 'Gemfile'
      - 'sources/announcements/**'
      - 'reference-docs/announcements/**'
      - '.github/workflows/python-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'processed/**'
      - 'schemas/**'
      - 'lib/**'
      - 'spec/**'
      - 'Gemfile'
      - 'sources/announcements/**'
      - 'reference-docs/announcements/**'
      - '.github/workflows/python-prototype.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test review-candidate extraction
        run: python3 -m unittest discover -s tests -v
      - name: Exercise the saved reference corpus
        run: python3 scripts/extract_review_candidates.py --source-root . --output-dir "${{ runner.temp }}/ru-review-candidates"
      - name: Inventory source dates without network access
        run: python3 scripts/check_source_updates.py --source-root . --offline --output-dir "${{ runner.temp }}/ru-source-check"
      - name: Preserve manual data in a complete review bundle
        run: python3 scripts/prepare_import_review.py --source-root . --candidates-dir "${{ runner.temp }}/ru-review-candidates" --state-file "${{ runner.temp }}/ru-source-check/check-manifest.json" --output-dir "${{ runner.temp }}/ru-import-review"
      - name: Verify the published conversion matches its saved sources
        shell: bash
        run: |
          python3 scripts/convert_reviewed_candidates.py --source-root . --output-dir "$RUNNER_TEMP/ru-processed"
          diff -ru --exclude=.gitkeep processed "$RUNNER_TEMP/ru-processed"

  processed-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Run the Ruby specs
        run: bundle exec rspec
      - name: Validate every published announcement
        run: |
          bundle exec ruby -Ilib -rammitto-data-ru/schema_validator -e '
            files = Dir["processed/*.yml"].sort
            abort "Expected 21 processed source notices" unless files.length == 21
            validator = AmmittoDataRU::SchemaValidator.new
            results = files.map { |file| validator.validate_file(file) }
            puts results.map(&:report)
            abort "Published source schema validation failed" unless results.all?(&:valid)
          '
