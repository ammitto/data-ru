  "announcement": {
    "title": {
      "ru": "Заявление МИД России в связи с введением персональных санкций в отношении граждан США"
    },
    "url": "https://www.mid.ru/ru/foreign_policy/news/1819686/",
    "lang": "ru",
    "publish_date": "2022-06-28",
    "publish_time": "11:44",
    "content": {
      "ru": "\n28.06.2022 11:44\nЗаявление МИД России в связи с введением персональных санкций в отношении граждан США\n\n1345-28-06-2022\n\nВ качестве ответа на постоянно расширяющиеся санкции США против российских политических и общественных деятелей, в «стоп-лист» вносятся 25 американских граждан из числа ответственных за формирование русофобского курса сенаторов, участников т.н. группы «Макфол-Ермак», которая занимается разработкой рекомендаций относительно антироссийских рестрикций, а также членов семьи Президента Дж.Байдена.\n\nНиже следует поименный перечень:\n\n\nДжилл БАЙДЕН\n(Jill Tracy Jacobs Biden)\n\n–\n\nсупруга Президента США Дж.Байдена\n\n\nЭшли БАЙДЕН (Ashley Blazer Biden)\n\n–\n\nдочь Дж.Байдена\n\n\nЧарльз ГРАССЛИ (Charles Ernest Grassley)\n\n–\n\nчлен Сената Конгресса США от Республиканской партии (шт. Айова)\n\n\nЛарри ДАЙМОНД (Larry Jay Diamond)\n\n–\n\nпрофессор Стэнфордского университета\n\n\nКирстен ДЖИЛЛИБРАНД (Kirsten Elizabeth Rutnik Gillibrand)\n\n–\n\nчлен Сената от Демократической партии\n(шт. Нью-Йорк)\n\n\nДжеффри ЗОННЕНФЕЛЬД (Jeffrey Sonnenfeld)\n\n–\n\nоснователь Института по вопросам лидерства при Йельском университете\n\n\nБронте КААС (Bronte Kaas)\n\n–\n\nменеджер программы Института международных исследований Фримана Спогли, Стэнфордский университет\n\n\nКрейг КЕННЕДИ (Craig Kennedy)\n\n–\n\nюрист Центра российских и евразийских исследований, Гарвардский университет\n\n\nЭнн КЛАНАН\n(Ann Clanan)\n\n–\n\nдоцент Центра международной безопасности и сотрудничества, Стэнфордский университет\n\n\nСьюзан КОЛЛИНЗ (Susan Margaret Collins)\n\n–\n\nчлен Сената от Республиканской партии\n(шт. Мэн)\n\n\nДэвид КРАМЕР (David J. Kramer)\n\n–\n\nбывший заместитель Государственного секретаря по вопросам демократии, прав человека и труда\n\n\nЛестер КРАУН (Lester Crown)\n\n–\n\nпрофессор Йельского университета\n\n\nМитч МАККОННЕЛЛ (Addison Mitchell Mcconnell III)\n\n–\n\nчлен Сената от Республиканской партии\n(шт. Кентукки)\n\n\nКристофер МИЛЛЕР (Christopher Miller)\n\n–\n\nдоцент школы Флэтчера, университет Тафтса\n\n\nДинша МИСТРИ (Dinshaw Mistry)\n\n–\n\nаспирант Института Гувера и Стэнфордской школы права\n\n\nРичард МОРНИНГСТАР (Richard L. Morningstar)\n\n–\n\nбывший Посол США в Азербайджане и Специальный представитель по евразийской энергетике\n\n\nДжейкоб НЕЛЛ (Jacob Nell)\n\n–\n\nбывший главный экономист по России и руководитель отдела европейской экономики компании «Морган Стэнли»\n\n\nРичард НЕФЬЮ (Richard Nephew)\n\n–\n\nстарший научный сотрудник Центра глобальной энергетической политики, Колумбийский университет\n\n\nБенджамин САСС (Benjamin Eric Sass)\n\n–\n\nчлен Сената от Республиканской партии\n(шт. Небраска)\n\n\nКэтрин СТОУНЕР (Kathryn Stoner)\n\n–\n\nпрофессор Стэнфордского университета\n\n\nЭдвард ФИШМАН (Edward Fishman)\n\n–\n\nбывший руководитель Управления политики и внедрения экономических санкций Государственного департамента\n\n\nФрэнсис ФУКУЯМА (Yoshiro Francis Fukuyama)\n\n–\n\nпрофессор Стэнфордского университета\n\n\nМартин ХАЙНРИХ (Martin Trevor Heinrich)\n\n\n\n–\n\nчлен Сената от Демократической партии\n(шт. Нью-Мексико)\n\n\nДжеймс ХОДСОН (James Hodson)\n\n–\n\nглавный исполнительный директор компании «Эй-ай фор гуд фаундэйшн», соорганизатор группы «Экономисты за Украину»\n\n\nБенджамин ШМИДТ (Benjamin Schmidt)\n\n–\n\nспециалист по разработке проектов в Гарвардском университете\n\nС общим перечнем американских граждан, которым на бессрочной основе закрыт въезд на территорию Российской Федерации, можно ознакомиться в данном специальном разделе на сайте МИД России.\n"
    },
    "document_id": "1345-28-06-2022"
  },
