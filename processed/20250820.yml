  "announcement": {
    "title": {
      "ru": "Заявление МИД России об ответных персональных санкциях в отношении представителей СМИ, НПО, консалтинговых структур и экспертного сообщества Великобритании"
    },
    "url": "https://mid.ru/ru/foreign_policy/news/2042119/",
    "lang": "ru",
    "publish_date": "2025-08-20",
    "publish_time": "16:22",
    "content": {
      "ru": "\n20.08.2025 16:22\nЗаявление МИД России об ответных персональных санкциях в отношении представителей СМИ, НПО, консалтинговых структур и экспертного сообщества Великобритании\n\n1348-20-08-2025\n\nВ ответ на продолжающийся конфронтационный курс Лондона, в рамках которого предпринимаются усилия по демонизации нашей страны, активно фабрикуются антироссийские нарративы в целях снижения влияния Москвы на международной арене, а также ведется дальнейшее накачивание оружием неонацистского режима в Киеве, принято решение о включении в российский «стоп-лист» ряда представителей СМИ, НПО, консалтинговых структур и экспертного сообщества Великобритании.\n\nВ их числе лица, распространяющие дезинформацию и голословные обвинения в адрес России в контексте СВО и осуществляющие враждебную лоббистскую деятельность, в том числе ратующие за ужесточение антироссийской политики Запада и усиление поддержки киевского режима.\n\nУсилия британских пропагандистов носят безответственный характер, способствуют увеличению рисков дестабилизации мирового энергетического рынка и перенаправлению ресурсов Запада с содействия международному развитию на подпитку милитаристских устремлений Киева и поддержку собственного ВПК. В свою очередь, это бьет по странам Глобального Юга, который и без того испытывает на себе исторические последствия колониализма и империализма, а теперь еще и стал объектом неоколониальных устремлений Запада. Подобный «сопутствующий ущерб» отнюдь не беспокоит Лондон и его союзников, на словах выступающих за защиту общечеловеческих ценностей в украинском конфликте.\n\nБыстрота, с которой после начала СВО англичане вывели на новый уровень антироссийскую информационную кампанию, и примеры их нападок на другие страны свидетельствуют о том, что схожие пропагандистские рычаги могут быть применены против любого международного субъекта, действия которого перестают отвечать интересам «коллективного Запада».\n\nНиже следует список подданных Великобритании, а также сотрудничающих с деструктивными британскими медиа- и консалтинговыми структурами граждан третьих стран, которым отныне закрыт въезд в Российскую Федерацию:\n\nИэн Роланд ГАРНЕР (Ian Roland Garner), научный сотрудник Института Пилецкого (Pilecki Institute, Польша) и Центра международной и оборонной политики Университета Куинс (Канада);\nТом КИТИНГ (Tom KEATINGE), директор Центра по проблемам финансов и безопасности Королевского института оборонных исследований;\nДенис МАКШЕЙН (Denis MACSHANE), бывший заместитель министра иностранных дел Великобритании и экс-депутат британского парламента;\nЭлеанор НИКОЛ (Eleanor NICHOL), бывший исполнительный директор международной лоббистской организации B4Ukraine;\nИмоджен ПЕЙТЕР (Imogen PAYTER), руководитель НПО «Британские друзья Украины» (UK Friends of Ukraine);\nБенджамин ТАЛЛИС (Benjamin TALLIS), бывший директор НПО «Инициатива демократической стратегии» (Democratic Strategy Initiative, ФРГ) и руководящий сотрудник компании «Хелсинг» (Helsing, ФРГ);\nТоррин Марк УИЛКИНС (Torrin Mark WILKINS), директор НПО «Мозговой трест «Центр» (Centre Think Tank Foundation);\nРафаэль БЕР (Rafael BEHR), колумнист газеты «Гардиан»;\nДэвид Джозеф БЛЭР (David Joseph BLAIR), корреспондент газеты «Дейли телеграф»;\nЭдриэн Дэвид ГОЛДБЕРГ (Adrian David GOLDBERG), редактор и продюсер телеканала «Байлайн ТВ» (Byline TV, Великобритания);\nПол КОНРОЙ (Paul CONROY), фотограф-фрилансер;\nМэтью Филипп САЙЕД (Matthew Philip SYED), колумнист газеты «Таймс»;\nДжон Пол СУИННИ (John Paul SWEENEY), корреспондент газеты «Байлайн таймc» и телеканала «Байлайн ТВ»;\nДжеймс ХОЛЛАНД (James HOLLAND), публицист в области истории;\nНил БАРНЕТТ (Neil BARNETT), исполнительный директор консалтингового агентства Istok Associates Limited;\nУильям ГИДДЕС (William GEDDES), директор консалтинговой компании International Corporate Protection Limited;\nДоминик МЕРФИ (Dominic MURPHY), начальник Контртеррористического управления Лондонской полиции;\nДжонатан Руперт ХОЛЛ (Jonathan Rupert HALL), уполномоченный при Правительстве Великобритании по контртеррористическому законодательству;\nЗарина ЗАБРИСКИ (Zarina ZABRISKI), гражданка США, журналист-фрилансер и публицист на Украине, сотрудничает с телеканалом «Байлайн ТВ»;\nСэмюэл Нэйтэн РАМАНИ (Samuel Nathan RAMANI), гражданин Канады, колумнист газеты «Дэйли телеграф», ассоциированный научный сотрудник Королевского института оборонных исследований и исполнительный директор консалтинговой компании Pangea Geopolitical Risk Ltd;\nКейлин РОБЕРТСОН (Caolan ROBERTSON), гражданин Ирландии, журналист-фрилансер на Украине, сотрудничает с телеканалом «Байлайн ТВ».\nРабота над расширением российского «стоп-листа» будет продолжена.\n\n"
    },
    "document_id": "1348-20-08-2025"
  },
