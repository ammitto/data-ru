    "title": {
      "ru": "Заявление МИД России о персональных санкциях в отношении представителей силовых структур, пограничной службы и компаний-подрядчиков оборонного сектора Австралии"
    },
    "url": "https://mid.ru/en/maps/au/1823204/",
    "lang": "ru",
    "publish_date": "2022-07-21",
    "publish_time": "19:17",
    "content": {
      "ru": "\n21.07.2022 19:17\nЗаявление МИД России о персональных санкциях в отношении представителей силовых структур, пограничной службы и компаний-подрядчиков оборонного сектора Австралии\n\n1514-21-07-2022\n\nВ порядке ответа на принятое ранее решение официальной Канберры о введении санкций по австралийскому аналогу «Закона Магнитского» Российская Федерация на основе взаимности дополнительно вносит в национальный «стоп-лист» 39 человек из числа представителей силовых структур, пограничной службы, а также компаний-подрядчиков оборонного сектора Австралии.\n\nНиже следует поименный перечень:\n\n№ п/п\n\nИмя, фамилия\n\nИмя, фамилия на русском языке\n\nМесто работы/должность\n\n1\n\nMarc Ablong\n\nМарк Эблонг\n\nзаместитель Министра внутренних дел\n\n2\n\nBen Bayot\n\nБэн Бэйот\n\nуправляющий директор\nпо инфраструктуре компании Serco\n\n3\n\nDavid Brown\n\nДэвид Браун\n\nглава департамента по делам исправительных\nучреждений штата Южная Австралия\n\n4\n\nGarry Brown\n\nГэрри Браун\n\nдиректор по развитию компании Serco\n\n5\n\nJoe Buffone\n\nДжо Буффон\n\nдиректор департамента\nМинистерства внутренних дел\n\n6\n\nKatarina Carroll\n\nКатарина Кэрролл\n\nкомиссар Управления полиции\nштата Квинсленд\n\n7\n\nEmma Cassar\n\nЭмма Кассар\n\nкомиссар по делам исправительных\nучреждений штата Виктория\n\n8\n\nJamie Chalker\n\nДжейми Чалкер\n\nкомиссар Управления полиции\nСеверной территории\n\n9\n\nKevin Corcoran\n\nКевин Коркоран\n\nкомиссар по делам исправительных\nучреждений штата Новый Южный Уэльс\n\n10\n\nChris Dawson\n\nКрис Доусон\n\nкомиссар Управления полиции\nштата Западная Австралия\n\n11\n\nDwayne Freeman\n\nДэйн Фримэн\n\nпомощник комиссара\nАвстралийской пограничной службы\n\n12\n\nHamish Hansford\n\nХамиш Хэнсфорд\n\nдиректор департамента\nМинистерства внутренних дел\n\n13\n\nVanessa Holben\n\nВанесса Холбен\n\nдиректор департамента\nАвстралийской пограничной службы\n\n14\n\nNatalie Hutchins\n\nНатали Хатчинс\n\nМинистр по делам исправительных\nучреждений