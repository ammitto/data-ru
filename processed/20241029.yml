      "ru": "\n29.10.2024 17:37\nЗаявление МИД России о персональных санкциях в отношении антироссийски настроенных граждан Австралии\n\n2019-29-10-2024\n\nВ ответ на политически мотивированные санкции против российских физических и юридических лиц со стороны правительства Австралии, вводимые в рамках русофобской кампании «коллективного Запада», въезд в Российскую Федерацию на бессрочной основе закрывается дополнительно для 131 австралийца из числа представителей военно-промышленного комплекса, журналистов и общественных деятелей, формирующих в этой стране антироссийскую повестку дня.\n\nС учетом того, что официальная Канберра не намерена отказываться от антироссийского курса и продолжает вводить новые санкционные меры, работа над актуализацией российского «стоп-листа» будет продолжена.\n\nНиже следует поименный список австралийских граждан, вносимых в «стоп-лист»:\n\n№ п/п\n\nИмя, фамилия\n\nИмя, фамилия\nна русском языке\n\nМесто работы / Должность\n\n1\n\nKen Anderson\n\nКен Андерсон\n\nЧлен правления NIOA Group\n\n2\n\nCostigan Gabrielle Anne\n\nКостиган\nГэбриэль Энн\n\nУправляющий директор\nпо вопросам развития бизнеса компании Bae Systems\n\n3\n\nKateryna Argyrou\n\nКатерина\nАргиру\n\nСопредседатель Союза украинских организаций\nв Австралии\n\n4\n\nClint Baird\n\nКлинт Бэйрд\n\nЛейтенант-коммандер\nВоенно-морских сил Австралии\n\n5\n\nMichael Barton\n\nМайкл Бартон\n\nФинансовый директор\nкомпании Codan Ltd\n\n6\n\nJames Bennett\n\nДжеймс Беннетт\n\nИсполнительный вице-президент по вопросам космических систем компании Electro Optic Systems\n\n7\n\nAndrew Bertoncin\n\nЭндрю\nБертонсин\n\nУорент-офицер\nВоенно-морских сил Австралии\n\n8\n\nStephan Beyer\n\nСтефан Бейер\n\nНезависимый директор компании SPEE3D\n\n9\n\nNick Birbilis\n\nНик Бирбилис\n\nДекан Факультета естественных наук, инженерии\nи искусственной среды, профессор университета Дикина\n\n10\n\nDavid Black\n\nДэвид Блэк\n\nЧлен совета директоров оборонной компании\nElectro Optic Systems\n\n11\n\nUwe