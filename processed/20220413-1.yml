      "ru": "\n13.04.2022 21:01\nЗаявление МИД России об ответных персональных санкциях в отношении конгрессменов США\n\n806-13-04-2022\n\nВ порядке реакции на очередную «волну» антироссийских санкций, введенных Администрацией Дж.Байдена 24 марта с.г. против 328 депутатов Государственной Думы Федерального Собрания Российской Федерации, что с учетом прежде внесенных в «черный список» российских парламентариев составляет практически весь ее состав, вводятся «зеркальные» санкционные ограничения в отношении 398 членов Палаты представителей Конгресса США.\n\nУказанные лица, включая руководство и председателей комитетов нижней палаты американского Конгресса, вносятся в российский «стоп-лист» на постоянной основе. Вместе с другими действующими законодателями, кому, как Спикеру Н.Пелоси, въезд в Российскую Федерацию был закрыт ранее, «листированию» на основе взаимности подвергнуты все конгрессмены США.\n\nНиже следует поименный перечень:\n\n1. Питер Агилар (Peter Rey Aguilar) – член Палаты представителей Конгресса США от Демократической партии (шт. Калифорния);\n\n2. Альма Адамс (Alma Shealey Adams) – член Палаты представителей от Демократической партии (шт. Северная Каролина);\n\n3. Роберт Адерхольт (Robert Brown Aderholt) – член Палаты представителей от Республиканской партии (шт. Алабама);\n\n4. Синтия Аксне (Cynthia Lynne Axne) – член Палаты представителей от Демократической партии (шт. Айова);\n\n5. Ричард Аллен (Richard Wayne Allen) – член Палаты представителей от Республиканской партии (шт. Джорджия);\n\n6. Марк Амодей (Mark Eugene Amodei) – член Палаты представителей от Республиканской партии (шт. Невада);\n\n7. Лорен Андервуд (Lauren Ashley Underwood) – член Палаты представителей от Демократической партии (шт. Иллинойс);\n\n8. Фредерик Аптон (Frederick Stephen Upton) – член Палаты представителей от Республиканской партии (шт. Мичиган);\n\n9. Келли Армстронг (Kelly Michael Armstrong) – член Палаты представителей от Республиканской партии (шт. Северная Дакота);\n\n10. Джоди Аррингтон (Jodey Cook Arrington) – член Палаты представителей от Республиканской партии (шт. Техас);\n\n11. Брайан Бабин (Brian Philip Babin) – член Палаты представителей от Республиканской партии (шт. Техас);\n\n12. Теодор Бадд (Theodore Paul Budd) – член Палаты представителей от Республиканской партии (шт. Северная Каролина);\n\n13. Дональд Байер (Donald Sternoff Beyer Jr.) – член Палаты представителей от Демократической партии (шт. Вирджиния);\n\n14. Джеймс Бэрд (James Richard Baird) – член Палаты представителей от Республиканской партии (шт. Индиана);\n\n15. Стефани Байс (Stephanie Irene Bice) – член Палаты представителей от Республиканской партии (шт. Оклахома);\n\n16. Кеннет Бак (Kenneth Robert Buck) – член Палаты представителей от Республиканской партии (шт. Колорадо);\n\n17. Ларри Бьюшон (Larry Dean Bucshon) – член Палаты представителей от Республиканской партии (шт. Индиана);\n\n18. Уильям Балдерсон (William Troy Balderson) – член Палаты представителей от Республиканской партии (шт. Огайо);\n\n19. Нанетт Бэррэган (Nanette Diaz Barragan) – член Палаты представителей от Демократической партии (шт. Калифорния);\n\n20. Карен Бэсс (Karen Ruth Bass) – член Палаты представителей от Демократической партии(шт. Калифорния);\n\n21. Джордж Баттерфилд (George Kenneth Butterfield Jr.) – член Палаты представителей от Демократической партии (шт. Северная Каролина);\n\n22. Клифф Бенц (Cliff Stewart Bentz) – член Палаты представителей от Республиканской партии (шт. Орегон);\n\n23. Ами Бера (Amerish Babulal Bera) – член Палаты представителей от Демократической партии (шт. Калифорния);\n\n24. Джон Бергман (John Warren Bergman) – член Палаты представителей от Республиканской партии (шт. Мичиган);\n\n25. Майкл Берджес (Michael Clifton Burgess) – член Палаты представителей от Республиканской партии (шт. Техас);\n\n26. Тимоти Берчетт (Timothy Floyd Burchett) – член Палаты представителей от Республиканской партии (шт. Теннеси);\n\n27. Эндрю Биггс (Andrew Steven Biggs) – чле