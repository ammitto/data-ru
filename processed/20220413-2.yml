  "announcement": {
    "title": {
      "ru": "Заявление МИД России о введении персональных санкций в отношении канадских сенаторов"
    },
    "url": "https://mid.ru/en/foreign_policy/news/1809221/",
    "lang": "ru",
    "publish_date": "2022-04-13",
    "publish_time": "21:09",
    "content": {
      "ru": "\n13.04.2022 21:09\nЗаявление МИД России о введении персональных санкций в отношении канадских сенаторов\n\n807-13-04-2022\n\nВ связи с решением властей Канады, объявивших 24 марта с.г. о внесении всего состава Совета Федерации Федерального Собрания Российской Федерации в «черный список» лиц, на которых распространяются санкционные ограничения, включая запрет на въезд в страну, на основе взаимности вводятся контрмеры против действующих сенаторов канадского Парламента.\n\nУказанные лица внесены на постоянной основе в российский «стоп-лист» в порядке реакции на враждебные шаги, предпринимаемые Оттавой, которая вопреки национальным интересам пытается быть в авангарде русофобского курса нынешней Администрации США.\n\nПродолжение этой недальновидной линии, отражающей несостоятельность и зависимый характер канадской внешней политики, способно лишь умножить ущерб, наносимый самой Канаде и ее отношениям с Россией, принимая во внимание неизбежные российские ответные меры.\n\nНиже следует поименный перечень канадских сенаторов:\n\nМаргарет Андерсон (Margaret Dawn Anderson);\nДэвид Арно (David M. Arnot);\nСальма Атауллахжан (Salma Ataullahjan);\nДайана Беллемар (Diane Bellemare);\nВанда Бернард (Wanda Thomas Bernard);\nПитер Бим (Peter M. Boehm);\nРоберт Блэк (Robert Black);\nПатриция Бовей (Patricia Bovey);\nИвонн Бойер (Yvonne Boyer);\nГвен Бонифас (Gwen Boniface);\nПатрик Бразо (Patrick Brazeau);\nПьер-Хьюз Буавеню (Pierre-Hugues Boisvenu);\nБеверли Буссон (Beverley Busson);\nДениз Бэттерс (Denise Batters);\nЖозе Вернер (Josée Verner);\nГовард Ветстон (Howard Wetston);\nЮен Пау Ву (Yuen Pau Woo);\nРоза Галвез (Rosa Galvez);\nРаймонда Ганье (Raymonde Gagné);\nАмина Герба (Amina Gerba);\nМарк Голд (Marc Gold);\nДайана Гриффин (Diane F. Griffin);\nЖан-Ги Дажене (Jean-Guy Dagenais);\nПьер Дальфон (Pierre J. Dalphond);\nПэт Данкан (Pat Duncan);\nДонна Даско (Donna Dasko);\nМобина Джаффер (Mobina S. B. Jaffer);\nКолин Дикон (Colin Deacon);\nМарти Дикон (Marty Deacon);\nДеннис Доусон (Dennis Dawson);\nРене Дюпюи (Renée Dupuis);\nКлеман Жиньяк (Clément Gignac);\nКлод Кариньян (Claude Carignan);\nМарти Клайн (Marty Klyne);\nБернадетт Клемент (Bernadette Clement);\nМэри Койл (Mary Coyle);\nДжейн Корди (Jane Cordy);\nРене Кормье (René Cormier);\nБрент Коттер (Brent Cotter);\nДэниел Кристмас (Daniel Christmas);\nДжим Куинн (Jim Quinn);\nСтэн Кутчер (Stan Kutcher);\nЛарри Кэмпбелл (Larry W. Campbell);\nФрансес Ланкин (Frances Lankin);\nСандра Лавлейс Николас (Sandra M. Lovelace Nicholas);\nТони Лоффреда (Tony Loffreda);\nПатти Лабукан-Бенсон (Patti LaBoucane-Benson);\nМайкл МакДональд (Michael L. MacDonald);\nМэри Джейн Маккаллум (Mary Jane McCallum);\nМэрилу Макфедран (Marilou McPhedran);\nСаби Марва (Sabi Marwah);\nЙона Мартин (Yonah Martin);\nЭлизабет Маршал (Elizabeth Marshall);\nПол Массикотт (Paul J. Massicotte);\nМари-Франсуа.Межи (Marie-Françoise Mégie);\nТерри Мерсер (Terry M. Mercer);\nЖюли Мивилль-Дешен (Julie Miville-Dechêne);\nПерси Моклер (Percy Mockler);\nЛюси Монсьон (Lucie Moncion);\nРозмари Муди (Rosemary Moodie);\nФабиан Мэннинг (Fabian Manning);\nМишель Одетт (Michèle Audette);\nРатна Омидвар (Ratna Omidvar);\nВиктор Оу (Victor Oh);\nДеннис Паттерсон (Dennis Glen Patterson);\nШанталь Петиклер (Chantal Petitclerc);\nДональд Плетт (Donald Neil Plett);\nРоуз-Мэй Пуарье (Rose-May Poirier);\nКим Пэйт (Kim Pate);\nМохаммед-Икбал Равалиа (Mohamed-Iqbal Ravalia);\nПьеретт Рингетт (Pierrette Ringuette);\nДэвид Ричардс (David Richards);\nПаула Саймонс (Paula Simons);\nДжуди Сейдман (Judith G. Seidman);\nРаймонда Сен-Жермен (Raymonde Saint-Germain);\nЛарри Смит (Larry W. Smith);\nКарен Соренсен (Karen Sorensen);\nСкотт Таннас (Scott Tannas);\nВернон Уайт (Vernon White);\nПамела Уоллин (Pamela Wallin);\nЭрик Форест (Éric Forest);\nБрайан Фрэнсис (Brian Francis);\nДжордж Фьюри (George J. Furey);\nПитер Хардер (Peter Harder);\nНэнси Хартлинг (Nancy J. Hartling);\nЛео Хусакос (Leo Housakos);\nХасан Юссуф (Hassan Yussuff).\nВ ближайшее время планируются новые объявления о контрсанкциях применительно к Канаде, включая очередное расширение российского «стоп-листа».\n\n\n"
