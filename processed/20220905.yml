  "announcement": {
    "title": {
      "ru": "Заявление МИД России в связи с введением персональных санкций в отношении граждан США"
    },
    "url": "https://mid.ru/ru/maps/us/1828611/",
    "lang": "ru",
    "publish_date": "2022-09-05",
    "publish_time": "14:50",
    "content": {
      "ru": "\n05.09.2022 14:50\nЗаявление МИД России в связи с введением персональных санкций в отношении граждан США\n\n1789-05-09-2022\n\nВ порядке ответных мер на постоянно расширяемые Администрацией Дж.Байдена персональные санкции против граждан России, в отношении очередной группы лиц из числа членов Конгресса США, высокопоставленных чиновников, представителей делового и экспертного сообществ, а также деятелей культуры (25 чел.), вводится запрет на въезд в Российскую Федерацию на постоянной основе.\n\nНиже следует поименный перечень американских граждан, вносимых в российский «стоп-лист», исходя из принципа взаимности:\n\n\n\n\nМэтью АКСЕЛЬРОД (Matthew S. Axelrod)\n\n–\n\nзаместитель Министра торговли\n\n\nБрюс БОДИН\n(Bruce M. Bodine)\n\n–\n\nстарший вице-президент компании «Мозаик»\n\n\nДэвид БУРРИТ (David Boyd Burritt)\n\n–\n\nисполнительный директор металлургического концерна «Ю-Эс стил»\n\n\nДаниэль ВАЖДИЧ (Daniel P. Vajdich)\n\n–\n\nглава лоббистской фирмы\n«Йорктаун солюшнс»\n\n\nПол ГОБЛ\n(Paul A. Goble)\n\n–\n\nсотрудник Института мировой политики\n\n\nЛоренсо ГОНСАЛВЕС (Lorenco Gonsalves)\n\n–\n\nпрезидент компании горнодобывающего сектора «Кливленд клиффс»\n\n\nДон ГРЭЙВС\n(Don Graves)\n\n–\n\nзаместитель Министра торговли\n\n\nРиота ДЖОНЕН (Ryota Jonen)\n\n–\n\nдиректор «Всемирного движения за демократию»\n\n\nМарк КЕЛЛИ\n(Mark Edward Kelly)\n\n–\n\nсенатор от Демократической партии\n(шт. Аризона)\n\n\nТэа КЕНДЛЕР\n\n(Thea D. Rozman Kendler)\n\n–\n\nзаместитель Министра торговли\n\n\nВиктория КЛЕМЕНТ\n(Victoria Clement)\n\n–\n\nглава консалтинговой компании\n«Централ Эйша инсайтс»\n\n\nКевин КРАМЕР (Kevin John Kramer)\n\n–\n\nсенатор от Республиканской партии\n(шт. Северная Дакота)\n\n\nДэвид КРЭЙН\n(David Michael Crane)\n\n–\n\nглава НПО «Глобал эккаунтабилити нетворк»\n\n\nДжереми ПЕЛТЕР (Jeremy Pelter)\n\n–\n\nзаместитель Министра торговли\n\n\nШон ПЕНН\n(Sean Penn)\n\n–\n\nактер, режиссер, продюсер\n\n\nТомас ПЕРРИЕЛЛО (Thomas Stuart Price Perriello)\n\n–\n\nисполнительный директор фондов\n«Открытое общество»\n\n\nДжина РАЙМОНДО (Gina Raimondo)\n\n–\n\nМинистр торговли\n\n\nМайкл РАУНДС (Marion Michael Rounds)\n\n–\n\nсенатор от Республиканской партии\n(шт. Южная Дакота)\n\n\nДжон СЕРАФИНИ (John Serafini)\n\n–\n\nстарший управляющий компании\n«Хоукай 360»\n\n\nКирстен СИНЕМА (Kyrsten Lea Sinema)\n\n–\n\nсенатор от Демократической партии\n(шт. Аризона)\n\n\nРичард СКОТТ\n\n(Richard Lynn Scott)\n\n–\n\nсенатор от Республиканской партии\n(шт. Флорида)\n\n\nСтивен СТАРР (Stephen Frederick Starr)\n\n–\n\nоснователь и председатель Института Центральной Азии и Кавказа\n\n\nБен СТИЛЛЕР (Benjamin Edward Meara Stiller)\n\n–\n\nактер, режиссер, продюсер\n\n\nПатрик ТУМИ (Patrick Joseph Toomey Jr.)\n\n–\n\nсенатор от Республиканской партии\n(шт. Пенсильвания)\n\n\nЭнтони УИЛЛ\n\n(W. Anthony Will)\n\n–\n\nпрезидент химической компании\n«Си-Эф индастриз»\n\n\n\nВраждебные действия американских властей, которые продолжают следовать русофобским курсом, разрушая двусторонние связи и нагнетая конфронтацию между Россией и США, будут и далее получать решительный отпор.\n\nСо сводным списком граждан США, подпадающих под категорию «закрытников», можно ознакомиться здесь.\n\n"
    },
    "document_id": "1789-05-09-2022"
  },
