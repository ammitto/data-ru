  "announcement": {
    "title": {
      "ru": "Заявление МИД России о персональных санкциях в отношении антироссийски настроенных граждан Новой Зеландии"
    },
    "url": "https://www.mid.ru/ru/foreign_policy/news/1959715/",
    "lang": "ru",
    "publish_date": "2024-06-26",
    "publish_time": "21:07",
    "content": {
      "ru": "\n26.06.2024 21:07\nЗаявление МИД России о персональных санкциях в отношении антироссийски настроенных граждан Новой Зеландии\n\n1225-26-06-2024\n\nВ ответ на политически мотивированные санкции против российских физических и юридических лиц со стороны правительства Новой Зеландии, вводимые в рамках русофобской кампании «коллективного Запада», въезд в нашу страну на бессрочной основе закрывается дополнительно для 36 новозеландцев из числа политических деятелей, руководителей силовых структур, преподавателей высших учебных заведений, журналистов и общественных деятелей, формирующих в этой стране антироссийскую повестку дня (ниже следует поименный перечень).\n\nС учетом того, что официальный Веллингтон не намерен отказываться от антироссийского курса и продолжает принимать новые санкционные меры, работа над актуализацией российского «стоп-листа» будет продолжена.\n\n\n\n№ п/п\n\nИмя, фамилия\n\nИмя, фамилия\nна русском языке\n\nМесто работы / Должность\n\n1\n\nJohn Battersby\n\nДжон Баттерсби\n\nпреподаватель Центра оборонных\nи стратегических исследований Университета Мэсси\n\n2\n\nMatt Blake\n\nМэтт Блейк\n\nмайор, старший офицер контингента BC НЗ\nпо подготовке ВСУ\nв Великобритании\n\n3\n\nPaul Buchanan\n\nПол Бьюкенен\n\nдиректор компании\n36th Parallel Assessment\n\n4\n\nDel Carlini\n\nДел Карлини\n\nобозреватель вопросов геополитики\n\n5\n\nCharlotte Cook\n\nШарлотта Кук\n\nжурналист, продюсер государственной радиокомпании\n«Рэдио Нью Зиланд»\n\n6\n\nMichael Cropp\n\nМайкл Кропп\n\nведущий продюсер радиокомпании\n«Рэдио Нью Зиланд»\n\n7\n\nRachel Heyler Donaldron\n\nРейчел Хейлер Доналдрон\n\nрепортер государственной радиокомпании\n«Рэдио Нью Зиланд»\n\n8\n\nBronwyn\nEvans-Kent\n\nБронуин Эванс-Кент\n\nначальник управления по оборонной политике Министерства обороны\n\n9\n\nCharlie Gates\n\nЧарли Гейтс\n\nстарший репортер медиакомпании «Стафф»\n\n10\n\nJarrod Gilbert\n\nДжаррод Гилберт\n\nсоциолог,\nУниверситет Кентербери\n\n11\n\nJames Halpin\n\nДже