      "ru": "\n01.08.2022 10:37\nГраждане Великобритании, находящиеся под персональными санкциями, включая запрет на въезд в Российскую Федерацию\n\nПо состоянию на 10 апреля 2024 года\n\nБорис ДЖОНСОН (Alexander Boris de Pfeffel JOHNSON) - премьер-министр;\nДоминик РААБ (Dominic Rennie RAAB) - заместитель премьер-министра, министр юстиции;\nЭлизабет ТРАСС (Elizabeth Mary TRUSS) - министр иностранных дел;\nБен УОЛЛЕС (Ben WALLACE) - министр обороны;\nГрант ШАППС (Grant SHAPPS) - министр транспорта;\nПрити ПАТЕЛ (Priti PATEL) - министр внутренних дел;\nРиши СУНАК (Rishi SUNAK) - министр финансов;\nКвази КВАРТЕНГ (Kwasi KWARTENG) - министр предпринимательства, энергетики и промышленной стратегии;\nНадин ДОРРИС (Nadine Vanessa DORRIES) - министр цифровизации, культуры, СМИ и спорта;\nДжеймс ХИППИ (James HEAPPEY) - заместитель министра обороны;\nНикола СТЕРДЖЕН (Nicola Ferguson STURGEON) - первый министр Шотландии;\nСуэлла БРАВЕРМАН (Suella BRAVERMAN) - генеральный прокурор Англии и Уэльса;\nТереза МЭЙ (Theresa MAY) - депутат парламента от консервативной партии, бывшая премьер-министр Великобритании,\nДжон Фрэнсис МАКФОЛЛ (John Francis MCFALL), председатель Палаты лордов,\nРозалинд Мириам АЛТМАНН (Rosalind Miriam ALTMANN),\nДжойс Энн ЭНЛЕЙ (Joyce Anne ANELAY),\nДжеймс Норидж АРБУТНОТ (James Norwich ARBUTHNOT),\nАртур Десмонд Колкхун ГОР (Arthur Desmond Colquhoun GORE),\nТомас Генри ЭШТОН (Thomas Henry ASHTON),\nДжон Джейкоб АСТОР (John Jacob ASTOR),\nДжон Ричард ЭТТЛИ (John Richard ATTLEE),\nКеннет Уилфред БЕЙКЕР (Kenneth Wilfred BAKER),\nДиана Франческа Кэролайн БЭРРЭН (Diana Francesca Caroline BARRAN),\nМайкл Уолтон БЕЙТС (Michael Walton BATES),\nЭлизабет Роуз БЕРРИДЖ (Elizabeth Rose BERRIDGE),\nДжеймс Николас БЕТЕЛЛ (James Nicholas BETHELL),\nДэвид Джон МАКЛИН (David John MACLEAN),\nОливия БЛУМФИЛД (Olivia BLOOMFIELD),\nДжеффри Роберт Джеймс БОРИК (Geoffrey Robert James BORWICK),\nНиколас Генри БОРН (Nicholas Henry BOURNE),\nАйвон Энтони МУР-БРАБАЗОН (Ivon Anthony MO