    "content": {
      "ru": "\n17.04.2024 11:23\nЗаявление МИД России в связи с введением персональных санкций в отношении муниципальных депутатов Австралии\n\n703-17-04-2024\n\nВ ответ на политически мотивированные санкции против российских физических и юридических лиц со стороны правительства Австралии, вводимые в рамках русофобской кампании «коллективного Запада», въезд в нашу страну на бессрочной основе закрывается дополнительно для 235 австралийцев из числа депутатов муниципальных собраний, формирующих в этой стране антироссийскую повестку дня (ниже следует поименный перечень).\n\nС учетом того, что официальная Канберра не намерена отказываться от антироссийского курса и продолжает вводить новые санкционные меры, работа над актуализацией российского «стоп-листа» будет продолжена.\n\n№ п/п\tИмя, фамилия\tИмя, фамилия на русском языке\tМесто работы/ Должность\n\nJuliana Addison\tДжулиана Эддисон\nчлен законодательного собрания штата Виктория\n\n(c 2018 г. по настоящее время)\n\n2.\n\nDaniel Andrews\tДэниел Эндрюс\nчлен законодательного собрания штата Виктория\n\n(с 2002 по 2023 гг.);\n\nбывш. премьер штата Виктория\n\n(с 2014 по 2023 гг.)\n\n3.\n\nSarah Andrews\tСара Эндрюс\nчлен палаты собраний штата Южная Австралия\n\n(c 2022 г. по настоящее время)\n\n4.\n\nNeil Angus\tНил Ангус\nчлен законодательного собрания штата Виктория\n\n(с 2010 по 2022 гг.)\n\n\nMatthew Bach\n\nМэттью Бах\n\nчлен законодательного собрания штата Виктория\n\n(с 2020 г. по настоящее время)\n\n\nRodney Barton\n\nРодни Бартон\n\nчлен законодательного собрания штата Виктория\n\n(с 2018 по 2022 гг.)\n\n\nDavid Basham\n\nДэвид Бэшем\n\nчлен палаты собраний штата Южная Австралия\n\n(c 2018 г. по настоящее время)\n\n\nRyan Batchelor\n\nРайан Бэтчелор\n\nчлен законодательного собрания штата Виктория\n\n(с 2022 г. по настоящее время)\n\n\nJack Batty\n\nДжек Бэтти\n\nчлен палаты собраний штата Южная Австралия\n\n(c 2022 г. по настоящее время)\n\n\nMelina Bath\n\nМелина Бэт\n\nчлен законодательного собрания штата Ви