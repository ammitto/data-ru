      "ru": "\n19.05.2023 19:21\nЗаявление МИД России в связи с введением персональных санкций в отношении граждан США\n\n976-19-05-2023\n\nВ ответ на регулярно вводимые администрацией Дж.Байдена антироссийские санкции, которые призваны, по замыслу Вашингтона, нанести России максимальный ущерб, персонально затронув официальных лиц и простых граждан нашей страны, в порядке контрмер закрывается въезд в Российскую Федерацию для 500 американцев.\n\nВ их числе – не только «знаковые» фигуры, включая бывшего президента США Б.Обаму, но и действующие руководители различных уровней исполнительной власти, экс-чиновники вроде куратора Белого дома по борьбе с «российской дезинформацией» Н.Янкович, впервые избранные на ноябрьских выборах-2022 сенаторы и конгрессмены, эксперты и сотрудники «аналитических» центров, причастные к распространению русофобских установок и фейков, а также главы компаний ВПК, поставляющих вооружения режиму в Киеве. В прилагаемый «список-500» внесены и те во властных и правоохранительных структурах, кто непосредственно причастен к преследованиям инакомыслящих по следам т.н. «штурма Капитолия».\n\nВашингтону пора давно усвоить, что ни один враждебный выпад против России не останется без жесткой реакции. Принцип неотвратимости наказания будет последовательно применяться, идет ли речь об ужесточении санкционного прессинга или дискриминационных шагах с целью воспрепятствовать профессиональной деятельности наших сограждан.\n\nВ данной связи подтверждаем, что запрос посольства США в Москве о консульском посещении арестованного за шпионаж репортера Э.Гершковича в очередной раз отклоняется в порядке реагирования на невыдачу виз российским журналистам из пула Министра иностранных дел С.В.Лаврова, в результате чего они не смогли вылететь в Нью-Йорк для сопровождения его визита в рамках председательства России в Совете Безопасности ООН.\n\nНиже следует поименный перечень граждан США, вносимых в «стоп-лист» на постоянной основе:\n\n1.      Кара Аберкромби (Cara Abercrombie) – старший директор по оборонным вопросам Совета национальной безопасности;\n\n2.      Роберт Абернети (Robert J. Abernethy) – вице-председатель НПО «Атлантический совет»;\n\n3.      Майкл Абрамович (Michael J. Abramowitz) – президент НПО «Фридом Хаус»;\n\n4.      Брюс Адамс (Bruce Adams) – исполнительный вице-президент корпорации «Ин-Кью-Тел»;\n\n5.      Палома Адамс-Аллен (Paloma Adams-Allen) – заместитель директора Агентства по международному развитию;\n\n6.      Аарон Азелтон (Aaron Azelton) – директор программ гражданского участия исследовательского центра «Национальный демократический институт международных отношений»;\n\n7.      Глен Айви (Glenn Frederick Ivey) – член Палаты представителей от Демократической партии (шт. Мэриленд);\n\n8.      Стюарт Айзенштат (Stuart Е. Eizenstat) – член совета директоров НПО «Атлантический совет»;\n\n9.      Жасмин Александер-Грин (Jasmine Alexander-Greene) – аналитик-исследователь по России и Евразии «Фонда Карнеги»;\n\n10.    Джилл Альбертелли (Jill М. Albertelli) – президент подразделения военных двигателей корпорации «Пратт энд Уитни»;\n\n11.    Меган Андерсон (Megan Anderson) – исполнительный вице-президент корпорации «Ин-Кью-Тел»;\n\n12.    Скотт Андерсон (Scott R. Anderson) – эксперт Брукингского института;\n\n13.    Майя Арболино (Maija Arbolino) – финансовый директор Фондов «Открытое общество»;\n\n14.    Ричард Армитэдж (Richard L. Armitage) – член совета директоров НПО «Центр новой американской безопасности»;\n\n15.    Лестер Арнольд (Lester Arnold) – вице-президент исследовательского центра «РЭНД корпорейшн»;\n\n16.    Эдриенн Аршт (Adrienne Arsht) – исполнительный заместитель председателя НПО «Атлантический совет»;\n\n17.    Ребекка Балинт (Rebecca Balint) – член Палаты представителей от Демократической партии (шт. Вермонт);\n\n18.    Гектор Бальдерас (Hector Balderas) – бывший генпрокурор штата Нью-Мексико;\n\n19.    Валери Банс (Valerie Jane Bunce) – профессор Корнельского университета;\n\n20.    Майкл Бар