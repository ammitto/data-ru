      "ru": "\n12.04.2023 15:55\nЗаявление МИД России о введении персональных санкций в отношении ряда граждан Канады\n\n684-12-04-2023\n\nВвиду антироссийских санкций, периодически вводимых режимом Дж.Трюдо против официальных лиц, политиков, экспертов, журналистов, деятелей культуры и спортсменов из России, а также всех, кто не устраивает оттавский «мейнстрим» и поддерживаемые им неонацистские власти в Киеве, въезд в Российскую Федерацию закрывается на постоянной основе для 333 граждан Канады.\n\nПридерживаясь принципа неотвратимости наказания, российская сторона в ответ на враждебные действия Оттавы внесла в «стоп-лист» представителей канадского руководства, парламентариев и политиков различного уровня, общественных активистов и атлетов, причастных к распространению в стране оголтелой русофобии. Эта мера призвана также побудить попавших в «черный список» изменить свое поведение.\n\nНиже следует пофамильный перечень «списка-333»:\n\nМэри Саймон (Mary Jeannie May Simon) – генерал-губернатор Канады;\nПитер Бетленфалви (Peter Bethlenfalvy) – министр финансов провинции Онтарио;\nПол Каландра (Paul Calandra) – министр по делам соцучреждений, министр по вопросам законодательства провинции Онтарио;\nРэймонд Сун Юн Чо (Raymond Sung Joon Cho) – министр по делам пожилых людей и инвалидов провинции Онтарио;\nМонте Макнотон (Monte Gary McNaughton) – министр труда, иммиграции, обучения и развития навыков провинции Онтарио;\nСтэн Чо (Stan Cho) – заместитель министра транспорта провинции Онтарио;\nСтив Кларк (Steve Clark) – министр муниципальных вопросов и жилищного строительства провинции Онтарио;\nДаг Дауни (Doug Downey) – генеральный прокурор провинции Онтарио;\nДжил Данлоп (Jill Dunlop) – министр по вопросам колледжей и университетов провинции Онтарио;\nВиктор Федели (Victor Fedeli) – министр экономического развития, трудоустройства и торговли провинции Онтарио;\nМайкл Форд (Michael D. Ford) – министр по делам гражданства и мультикультурализма провинции Онтарио;\nМерили Фуллертон (Merrilee Fullerton) – министр по делам детей, общественных организаций и социальных услуг провинции Онтарио;\nПарм Гилл (Parm Gill) – министр по дебюрократизации провинции Онтарио;\nМайкл Керцнер (Michael S. Kerzner) – генеральный солиситор провинции Онтарио;\nСтивен Лечче (Stephen Lecce) – министр образования провинции Онтарио;\nНейл Лумсден (Neil James Lumsden) – министр туризма, культуры и спорта провинции Онтарио;\nКэролайн Малруни (Caroline Mulroney) – министр по делам франкофонии, министр транспорта провинции Онтарио;\nМайкл Парса (Michael Parsa) – заместитель министра жилищного строительства провинции Онтарио;\nДэвид Пиччини (David Piccini) – министр по делам окружающей среды, заповедников и парков провинции Онтарио;\nДжордж Пири (George Pirie) – министр горнодобывающей промышленности провинции Онтарио;\nКалид Рашид (Kaleed Rasheed) – министр государственных и деловых услуг провинции Онтарио;\nГрег Рикфорд (Greg Rickford) – министр по делам коренных народов, Министр по делам развития крайнего Севера провинции Онтарио;\nПрабмит Сингх Саркария (Prabmeet Singh Sarkaria) – руководитель казначейства провинции Онтарио;\nГрэйдон Смит (Graydon Smith) – министр природных ресурсов и лесного хозяйства провинции Онтарио;\nТодд Эндрю Смит (Todd Andrew Smith) – министр энергетики провинции Онтарио;\nКинга Сурма (Kinga Surma) – министр инфраструктуры провинции Онтарио;\nЛиза Томпсон (Lisa M.Thompson) – министр сельского хозяйства, продовольствия и сельских районов провинции Онтарио;\nМайкл Тиболло (Michael A.Tibollo) – министр по вопросам психического здоровья и наркозависимости провинции Онтарио;\nШармэн Уильямс (Charmaine A. Williams) – министр социальных и экономических возможностей для женщин провинции Онтарио;\nДипак Ананд (Deepak Anand) – депутат Законодательного собрания провинции Онтарио;\nТеодор Арнотт (Theodore Calvin Arnott) – депутат Законодательного собрания провинции Онтарио;\nАрис Бабикян (Aris Babikian) – депутат Законодательного собрания провинции Онт