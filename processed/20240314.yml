    "content": {
      "ru": "\n14.03.2024 13:20\nЗаявление МИД России в связи с введением персональных санкций в отношении граждан США\n\n482-14-03-2024\n\nВ контексте ответных мер на постоянно расширяющиеся санкции, вводимые в массовом порядке американскими властями против граждан России за «поддержку Кремля и специальной военной операции», въезд в Российскую Федерацию закрывается для 227 американцев, причастных к разработке, реализации и оправданию русофобского курса нынешней Администрации США, а также непосредственно вовлеченных в антироссийские акции.\n\nРечь идет о конкретных лицах в структурах исполнительной власти, деловом сообществе, медийной сфере и академических кругах, которые регулярно «отмечаются» враждебными выпадами либо распространением измышлений и откровенной клеветы о внешней и внутренней политике России. В дополнение к объявлению нежелательными в Российской Федерации ряда американских НКО гуманитарного профиля, использовавшихся посольством США в Москве для рекрутирования «агентуры влияния», нынешнее расширение российского «стоп-листа» имеет целью, помимо прочего, закрепить у Вашингтона на рефлекторном уровне осознание простой истины, что любые агрессивные поползновения не остануться безнаказанными и получат решительный отпор.\n\nНиже следует поименный перечень американских граждан, вносимых в «стоп-лист» на постоянной основе:\n\nРави Абделяль (Rawi Abdelal) – директор Центра Дэвиса по изучению России и Евразии при Гарвардском университете;\nРичард Андерсон (Richard D. Anderson Jr.) – почетный профессор Калифорнийского университета;\nМарк Андричик (Mark Andryczyk) – научный сотрудник Института Гарримана при Колумбийском университете;\nМахмуд Ба (Mahmoud Bah) – заместитель исполнительного директора госкорпорации «Миллениум чэллендж корпорэйшн»;\nПайам Баназаде (Payam Banazadeh) – исполнительный директор компании «Капелла спэйс»;\nЧарльз Бекер (Charles Maxwell Becker) – заместитель руководителя кафедры экономики Университета Дьюка;\nДэниел Бесснер (Daniel Bessner) – сотрудник Вашингтонского университета;\nЛада Биланюк (Laada Bilaniuk) – профессор Вашингтонского университета;\nРоберт Бирман (Robert Bierman) – член правления «Балкан инвестигэйтив репортинг нетворк»;\nСтивен Бланк (Stephen Blank) – старший научный сотрудник НПО «Институт изучения внешней политики»;\n Джейсон Бордофф (Jason Eric Bordoff) – директор Центра глобальной энергетической политики Колумбийского университета;\n Анжела Брайтлингер (Angela Britlinger) – директор Центра славянских, восточноевропейских и евразийских исследований при Университете штата Огайо;\nМэриэнн Браун (Marianne С. Brown) – член совета директоров холдинга «Нортроп Грумман»;\n Тревор Браун (Trevor Brown) – декан Колледжа по связям с общественностью им. Джона Гленна при Университете штата Огайо;\n Рэйчел Бричта (Rachel Brichta) – руководящий сотрудник Центра российских, восточноевропейских и евразийских исследований Мичиганского университета;\nСара Бьянчи (Sarah Bianchi) – заместитель Торгового представителя США;\nАллен Вайнер (Allen S. Weiner) – директор Центра по международным конфликтам и переговорам при Стэнфордском университете;\n Амир Вайнер (Amir Weiner) – директор Центра российских, восточноевропейских и евразийских исследований при Стэнфордском университете;\n Александра Вакро (Alexandra Vacroux) – исполнительный директор Центра Дэвиса по изучению России и Евразии при Гарвардском университете;\nДэниэл Вартко (Daniel Wartko) – советник делегации США при ОБСЕ по вопросам контроля над вооружениями;\nДжеффри Вейдлингер (Jeffrey Veidlinger) – профессор истории и иудаизма в Мичиганском университете;\nКэти Видал (Kathi Vidal) – старший заместитель министра торговли;\nАлександр Виндман (Alexander Vindman) – генеральный директор ЧВК «Трайдент саппорт»;\nЛорейн Волес (Lorraine Ann Voles) – глава аппарата Вице-президента;\nДжошуа Волц (Joshua Volz) – зам.заместителя министра энергетики;\nДжеффри Вуд (Jeffrey Wood) – генеральный менеджер американского представительства компании «Конгсберг прот