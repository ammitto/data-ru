    "title": {
      "ru": "Заявление МИД России о персональных санкциях в отношении антироссийски настроенных граждан Австралии"
    },
    "url": "https://mid.ru/en/foreign_policy/news/1959710/",
    "lang": "ru",
    "publish_date": "2024-06-26",
    "publish_time": "21:00",
    "content": {
      "ru": "\n26.06.2024 21:00\nЗаявление МИД России о персональных санкциях в отношении антироссийски настроенных граждан Австралии\n\n1224-26-06-2024\n\nВ ответ на политически мотивированные санкции против российских физических и юридических лиц со стороны правительства Австралии, вводимые в рамках русофобской кампании «коллективного Запада», въезд в нашу страну на бессрочной основе закрывается дополнительно для 27 австралийцев из числа бывших политических деятелей, руководителей австралийских компаний, преподавателей высших учебных заведений, журналистов и общественных деятелей, формирующих в этой стране антироссийскую повестку дня (ниже следует поименный перечень).\n\nС учетом того, что официальная Канберра не намерена отказываться от антироссийского курса и продолжает принимать новые санкционные меры, работа над актуализацией российского «стоп-листа» будет продолжена.\n\n\n\n№ п/п\n\nИмя, фамилия\n\nИмя, фамилия\n\nна русском языке\n\nМесто работы/должность\n\n1\n\nTony Abbott\n\nТони Эбботт\n\nбывший премьер-министр (2013-2015 гг.)\n\n2\n\nChris Barter\n\nКрис Бартер\n\nсоучредитель и партнер инвестиционной компании King River Capital\n\n3\n\nOlga Boichak\n\nОльга Бойчак\n\nстарший преподаватель\nв Университете Сиднея, социолог\n\n4\n\nSergiy Budkin\n\nСергей Будкин\n\nпартнер-основатель украинской инвестиционно-банковской компании FinPoint\n\n5\n\nEd Cavanour\n\nЭд Каванур\n\nглавный исполнительный директор\n\nИнститута МакКелла\n\n6\n\nStephen Chappell\n\nСтефан Чеппел\n\nвице-маршал авиации\n\n7\n\nRobert Chipman\n\nРоберт Чипмен\n\nзаместитель командующего Вооруженными силами\n\n8\n\nBill Crews\n\nБилл Крюс\n\nсвященослужитель\n\n9\n\nTanya Dus\n\nТаня Дус\n\nдиректор психиатрического отделения Королевской больницы принца Альфреда\n\n10\n\nGerard Dwyer\n\nДжерард Дуайер\n\nнациональный секретарь Ассоциации работников розничной торговли\nи смежных отраслей\n\n11\n\nNick Dyrenfurth\n\nНик Диренфурт\n\nисполнительный директор Исследовательского центра Дж.Кертина\n\n12\n\nBruce Edwards\n\nБрюс Эдвардс\n\nбывший посол Австралии на Украине (2020-2023 гг.)\n\n13\n\nChris Garnaut\n\nКрис Гарно\n\nоснователь, инвестиционный директор компании\nFawkner Property, иполнительный директор компании Garnaut\n\n14\n\nLyall Gorman\n\nЛайалл Горман\n\nпрезидент\nНКО Business NSW\n\n15\n\nJohn Howard\n\nДжон Говард\n\nбывший премьер-министр (1996-2007 гг.)\n\n16\n\nGeoffrey Kennett\n\nДжеффри Кеннет\n\nсудья Федерального суда Австралии\n\n17\n\nMichael Lawriwsky\n\nМайкл Лавривски\n\nлитератор\n\n18\n\nAndrew Mackellar\n\nЭндрю Маккеллар\n\nисполнительный директор торгово-промышленной палаты\n\n19\n\nMichael O'Bryan\n\nМайкл О'Брайан\n\nсудья Федерального суда Австралии\n\n20\n\nBarry O'Farrell\n\nБэрри О'Фаррелл\n\nбывший премьер штата Новый Южный Уэльс (2011-2014 гг.),\nпосол Австралии в Индии\n(2020-2023 гг.)\n\n21\n\nJon Richardson\n\nДжон Ричардсон\n\nбывший дипломат\n\n22\n\nAlex Ryvchin\n\nАлекс Ривчин\n\nруководитель «Исполнительного совета австралийского еврейства»\n\n23\n\nPete Shmigel\n\nПит Шмигель\n\nжурналист\n\n24\n\nIvan Slavich\n\nИван Славич\n\nдиректор компании Trident Corporate Services\n\n25\n\nMark Textor\n\nМарк Текстор\n\nсоучредитель, неисполнительный директор компании\nCT Group\n\n26\n\nDoug Trappett\n\nДаг Траппетт\n\nбывший посол Австралии на Украине (2015-2016 гг.)\n\n27\n\nRobert Tyson\n\nРоберт Тайсон\n\nбывший посол Австралии в России (2005-2008 гг.)\n"
    },
