    "title": {
      "ru": "Заявление МИД России об ответных персональных санкциях в отношении представителей политического истеблишмента и экспертного сообщества Великобритании"
    },
    "url": "https://www.mid.ru/ru/maps/gb/2049201/",
    "lang": "ru",
    "publish_date": "2025-09-26",
    "publish_time": "15:00",
    "content": {
      "ru": "\n26.09.2025 15:00\nЗаявление МИД России об ответных персональных санкциях в отношении представителей политического истеблишмента и экспертного сообщества Великобритании\n\n1585-26-09-2025\n\nВ Лондоне не оставляют надежд с помощью подконтрольного киевского режима все же нанести нашей стране стратегическое поражение. Дабы продлить жизнь терпящему одно поражение за другим «украинскому проекту», в минувшие дни в ход пущены обкатанные британцами инструменты манипуляции сознанием: очередной виток антироссийской шпиономании, фантазии о якобы нависшей над Европой «военной угрозе», с помпой объявленные экономические ограничения, правда, бьющие в основном по британской же экономике.\n\nЦиничные антироссийские авантюры продолжают исправно финансироваться Лондоном в ущерб деградирующей социально-экономической и, как следствие, внутриполитической обстановке в стране. Ситуация с выполнением британским правительством базовых социальных обязательств перед собственным населением с каждым месяцем все сильнее напоминает «Тришкин кафтан» – будь то в сфере сдерживания нелегальной миграции и разгула уличной преступности, или стимулирования экономического роста.\n\nВ ответ на сохраняющийся конфронтационный курс Лондона принято решение о включении в российский «стоп-лист» дополнительной группы представителей политического истеблишмента и «экспертного» сообщества Великобритании.\n\nВ их числе лица, запятнавшие себя агитацией в поддержку неправомерных односторонних ограничений, а также причастные к подрывной работе Лондона на российском направлении, в том числе фабрикации клеветнических домыслов и распространению дезинформации о нашей стране.\n\nНиже следует перечень подданных Великобритании, а также сотрудничающих с сеющими клевету и раздор британскими аналитическими и консалтинговыми центрами граждан третьих стран, которым отныне закрыт въезд в Российскую Федерацию:\n\n1. Бирн, Джеймс (Byrne, James), основатель и исполнительный директор британского исследовательского центра Open Source Centre;\n\n2. Дибел-Юнг, Анна (Deibel-Jung, Anna), заместитель директора Управления по применению торговых санкций Министерства предпринимательства и торговли Великобритании;\n\n3. Дуган, Дэвид Майкл (Doogan, David Michael), депутат Палаты общин Парламента Великобритании от Шотландской национальной партии;\n\n4. Петрокофски, Макс (Petrokofsky, Max), начальник Управления по применению финансовых санкций МИД Великобритании;\n\n5. Редловска, Кинга (Redlowska, Kinga), начальник европейского отдела Центра по проблемам финансов и безопасности и участник Целевой группы по морским санкциям, действующих в составе Королевского института оборонных исследований;\n\n6. Рейнолдс, Эмма Элизабет (Reynolds, Emma Elizabeth), министр окружающей среды, продовольствия и сельского хозяйства Великобритании, депутат Палаты общин Парламента Великобритании от Лейбористской партии;\n\n7. Эраскин, Гонсало Саис (Erasquin, Gonsalo Saiz), научный сотрудник Центра по проблемам финансов и безопасности и участник Целевой группы по морским санкциям, действующих в составе Королевского института оборонных исследований.\n\nТакже в список внесен ряд представителей Управления по применению финансовых санкций Министерства финансов Великобритании.\n\nХотели бы вновь подчеркнуть, что любые усилия британской стороны в погоне за дискредитацией и «изоляцией» России, в том числе в контексте СВО, будут неизменно получать решительный и жесткий отпор с нашей стороны.\n\nРабота над расширением российского «стоп-листа», обусловленная сохранением деструктивной британской политики по эскалации напряженности в Европе и мире, будет продолжена.\n"
    },
    "document_id": "1585-26-09-2025"
  },
