    "content": {
      "ru": "\n11.11.2022 19:26\nЗаявление МИД России в связи с введением персональных санкций в отношении граждан США\n\n2321-11-11-2022\n\nВ ответ на постоянно вводимые Администрацией Дж.Байдена все новые персональные санкции не только против российских официальных лиц, представителей деловых кругов и общественности, деятелей культуры, но и тех, кто по тем или иным причинам неугоден Вашингтону, на основе взаимности вводится запрет на въезд в Российскую Федерацию в отношении 200 граждан США. В их числе – отдельные представители органов власти и законодатели, а также их близкие родственники, руководители компаний и предприятий ВПК, эксперты и лоббисты, вовлеченные в раскрутку русофобской кампании и поддержку режима в Киеве.\n\nНиже следует пофамильный перечень «списка-200», фигуранты которого вносятся в российский «стоп-лист» на постоянной основе.\n\n1. Джон Абизаид (John Philip Abizaid) – генерал армии в отставке, советник Министра обороны Украины;\n\n2. Марвин Адамс (Marvin Lee Adams) – заместитель главы Национального управления по ядерной безопасности при Министерстве энергетики США;\n\n3. Эндрю Адамс (Andrew Adams) – глава межведомственной рабочей группы Министерства юстиции США по контролю за выполнением антироссийских санкций;\n\n4. Рой Азеведо (Roy Azevedo) – руководитель подразделения компании «Рэйтеон текнолоджис» по вопросам разведки и космоса;\n\n5. Джордж Акерлоф (George Akerlof) – супруг Министра финансов США Дж.Йеллен;\n\n6. Дмитрий Альперович (Dmitri Alperovich) – основатель и председатель НПО «Сильверадо полиси акселлератор»;\n\n7. Томас Арсено (Thomas Arnold Arseneault) – президент и старший исполнительный директор американского подразделения группы компаний «Би-Эй-И системс»;\n\n8. Надин Арсланян (Nadin Arslanian) – супруга сенатора Р.Менендеса;\n\n9. Валери Байден Оуэнс (Valerie Biden Owens) – сестра Президента США Дж.Байдена;\n\n10. Джеймс Байден (James Brian Biden) – брат Президента США Дж.Байдена;\n\n11. Фрэнсис Байден (Francis Willian Biden) – брат Президента США Дж.Байдена;\n\n12. Маргарита Балмаседа (Margarita М. Balmaceda) – профессор Гарвардского университета;\n\n13. Джордж Барнс (George C. Barnes) – заместитель директора Агентства национальной безопасности США;\n\n14. Кристофер Бердик (Christopher Burdick) – старший советник Управления по контролю за иностранными активами Министерства финансов США;\n\n15. Ричард Берр (Richard Mauze Burr) – сенатор-республиканец от штата Северная Каролина;\n\n16. Хавьер Бесерра (Xavier Becerra) – Министр здравоохранения и социальных служб США;\n\n17. Кори Блисс (Corry Bliss) – партнер пиар-компании «Плас коммуникэйшнс»;\n\n18. Марша Блэкберн (Mary Marsha Blackburn) – сенатор-республиканец от штата Теннесси;\n\n19. Тэмми Болдуин (Tammy Suzanne Green Baldwin) – сенатор-демократ от штата Висконсин;\n\n20. Британи Больо (Brittany Beaulieu) – исполнительный директор консалтинговой фирмы «Йорктаун солюшнс»;\n\n21. Барбара Боргонови (Barbara Jean Borgonovi) – старший вице-президент по корпоративной стратегии и развитию компании «Рэйтеон текнолоджис»;\n\n22. Джон Брайант (John Bryant) – исполнительный вице-президент корпорации «Ошкош» и глава ее оборонного подразделения;\n\n23. Ян Бреммер (Ian Arthur Bremmer) – президент и основатель консалтинговой компании «Юрэйжа груп»;\n\n24. Дэвид Броадбент (David John Broadbent) – вице-президент и главный операционный директор подразделения компании «Рэйтеон текнолоджис» по вопросам разведки и космоса;\n\n25. Лаэль Брэйнард (Lael Brainard) – заместитель председателя Федеральной резервной системы США;\n\n26. Януш Бугайски (Janusz Bugajski) – сотрудник НПО «Джеймстаунский фонд»;\n\n27. Фред Вагенхалс (Fred W. Wagenhals) – исполнительный директор и председатель правления оборонной компании «АММО»;\n\n28. Айрис Вайншолл (Iris Weinshall) – супруга сенатора Ч.Шумера;\n\n29. Глен Ванхерк (Glen D. VanHerck) – командующий Объединенного командования воздушно-космической обороны североамериканского континента и Северного командования ВС США;\n\n30. Дик Веллер (Dick Weller) – доктор Тихоокеанской Северо-Западной лаборатории США (г. Села, шт. Вашингтон);\n\n31. Томас Вилсак (Thomas James Vilsack) – Министр сельского хозяйства США;\n\n32. Нил Волин (Neal Wolin) – председатель совета директоров пиар-агентства «Брансуик»;\n\n33. Линн Гарланд (Lynn Rosenman Garland) – супруга Генерального прокурора США М.Гарланда;\n\n34. Эми Гоудер (Amy Gowder) – президент и главный исполнительный директор компании «Дженерал электрик эвиэйшн милитари системс»;\n\n35. Джордж Грабович (George G. Grabowicz) – профессор Гарвардского университета;\n\n36. Трейси Грей (Tracey Gray) – вице-президент по коммуникациям и внешним связям подразделения компании «Рэйтеон текнолоджис» по вопросам разведки и космоса;\n\n37. Брэдли Грив (Bradley Madsen Greve) – финансовый директор группы компаний «Би-Эй-И системс»;\n\n38. Байрон Грин (Byron Green) – вице-президент по глобальным операциям компании «Эл3Харрис текнолоджис»;\n\n39. Мартин Грюнберг (Martin J. Gruеnberg) – председатель совета директоров Федеральной корпорации по страхованию вкладов;\n\n40. Синтия Грюнсфельдер (Cynthia A. Gruensfelder) – вице-президент и генеральный менеджер по ракетным системам и вооружениям подразделения компании «Боинг компани»;\n\n41. Джон Гувер (John Hoover) – старший вице-президент Национального университета обороны США;\n\n42. Иво Даалдер (Ivo H. Daalder) – бывший постоянный представитель США при НАТО;\n\n43. Тэмми Дакворт (Ladda Tammy Duckworth) – сенатор-демократ от штата Иллинойс;\n\n44. Алисса Демус (Alyssa Demus) – эксперт исследовательского центра «РЭНД корпорейшн»;\n\n45. Фрэнк Джон (Frank А. St. John) – главный операционный директор корпорации «Локхид-Мартин»;\n\n46. Крис Джонсон (Chris Johnson) – старший вице-президент компании «Максар текнолоджиз»;\n\n47. Питер Дикинсон (Peter Dickinson) – эксперт НПО «Атлантический совет»;\n\n48. Чарльз Дэвис (Charles R. Davis) – вице-президент компании «Эл3Харрис текнолоджис»;\n\n49. Стивен Дэйнс (Steven David Daines) – сенатор-республиканец от штата Оклахома;\n\n50. Карин Жан-Пьер (Karine Jean-Pierre) – пресс-секретарь Белого дома;\n\n51. Уильям Иленфелд (William J. Ihlenfeld II) – прокурор Северного округа штата Западная Вирджиния;\n\n52. Джеймс Инхоф (James Mountain Inhofe) – сенатор-республиканец от штата Оклахома;\n\n53. Джен Истерли (Jen Easterly) – директор Агентства по кибербезопасности и защите инфраструктуры при Министерстве внутренней безопасности США;\n\n54. Кристофер Каволи (Christopher Gerard Cavoli – командующий Европейским командованием ВС США и верховный главнокомандующий объединенных ВС НАТО в Европе;\n\n55. Кимберли Каган (Kimberly Kagan) – основательница и президент «Института по изучению войны»;\n\n56. Фредерик Каган (Frederick W. Kagan) – старший научный сотрудник и руководитель проекта по анализу критических угроз «Института по изучению войны»;\n\n57. Колин Кал (Colin Hackett Kahl) – заместитель Министра обороны США;\n\n58. Мэтью Камински (Matthew Kaminski) – журналист;\n\n59. Шелли Капито (Shelley Wellons Moore Capito) – сенатор-республиканец от штата Западная Вирджиния;\n\n60. Мигель Кардона (Miguel Angel Cardona) – Министр образования США;\n\n61. Мара Карлин (Mara Elizabeth Karlin) – заместитель Министра обороны США;\n\n62. Томас Карпер (Thomas Richard Carper) – сенатор-демократ от штата Делавэр;\n\n63. Дженнифер Кафарелла (Jennifer Cafarella) – руководитель аппарата «Института по изучению войны»;\n\n64. Фредерик Кемп (Frederick Kempe) – президент и главный исполнительный директор НПО «Атлантический совет»;\n\n65. Томас Кент (Thomas Kent) – старший научный сотрудник НПО «Джеймстаунский фонд»;\n\n66. Уильям Кессиди (William Morgan Cassidy) – сенатор-республиканец от штата Луизиана;\n\n67. Джон Кеннеди (John Neely Kennedy) – сенатор-республиканец от штата Луизиана;\n\n68. Кристен Кларк (Kristen Clarke) – заместитель Министра юстиции США;\n\n69. Теодор Колберт (Theodore Colbert III) – главный исполнительный директор подразделения компании «Боинг компани»;\n\n70. Уильям Кортни (William Harrison Courtney) – внештатный сотрудник исследовательского центра «РЭНД корпорейшн», председатель попечительского совета НПО «Фонд Евразия»;\n\n71. Энтони Коттон (Anthony James Cotton) – командующий Командованием глобального удара ВВС США (утвержден Сенатом в должности командующего Стратегическим командованием ВС США);\n\n72. Марджери Краус (Margery Kraus) – основатель и председатель совета директоров пиар-компании «Арко»;\n\n73. Кристофер Кребс (Christopher Cox Crebs) – соучредитель консалтинговой информационно-технологической компании «Кребс Стамос груп»;\n\n74. Стивен Крупин (Stephen Krupin) – управляющий директор пиар-компании «Эс-Кей-Ди-Кей»;\n\n75. Кристофер Кубасик (Christopher E. Kubasik) – председатель и главный исполнительный директор компании «Эл3Харрис текнолоджис»;\n\n76. Роберт Лайтфут (Robert M. Lightfoot Jr.) – исполнительный вице-президент корпорации «Локхид-Мартин»;\n\n77. Томас Лалиберти (Thomas Laliberty) – руководитель подразделения компании «Рэйтеон текнолоджис»;\n\n78. Синтия Ламмис (Cynthia Marie Lummis Wiedersphahn) – сенатор-республиканец от штата Вайоминг;\n\n79. Майкл Ли (Michael Shumway Lee) – сенатор-республиканец от штата Юта;\n\n80. Меган Лотт (Megan Beth Lott) – старший директор по благотворительным партнерствам «Института по изучению войны»;\n\n81. Бен Лухан (Ben Ray Lujan) – сенатор-демократ от штата Нью-Мексико;\n\n82. Джессика Льюис (Jessica Ann Lewis) – заместитель Государственного секретаря США;\n\n83. Таня Майоркас (Tanya F. Mayorkas) – супруга Министра внутренней безопасности США А.Майоркаса;\n\n84. Эндрю Мак (Andrew Mac) – руководитель вашингтонского подразделения украинской юридической фирмы «Астэрс Ло»;\n\n85. Джуди Маккарти (Judy McCarthy) – супруга члена Палаты представителей К.Маккарти;\n\n86. Линда Маккол (Linda Mays McCaul) – супруга члена Палаты представителей М.Маккола;\n\n87. Джеймс МакКоннелл (James McConnell) – заместитель главы Национального управления по ядерной безопасности при Ми