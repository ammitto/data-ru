    "content": {
      "ru": "\n07.04.2022 18:54\nЗаявление МИД России о персональных санкциях в отношении представителей высшего руководства и парламентариев Австралии\n\n755-07-04-2022\n\nПослушно следуя курсом «коллективного Запада», Канберра в безоглядном русофобском запале ввела санкции, которые затронули высших руководителей Российской Федерации и практически весь депутатский корпус. В ответ с 7 апреля с.г. в «стоп-лист» лиц, которым закрыт въезд в Россию, включаются члены австралийского комитета по национальной безопасности, палаты представителей, сената и региональных законодательных собраний.\n\nДанный шаг предпринят в порядке реакции на недружественные действия нынешнего австралийского правительства, готового поддерживать любые действия, нацеленные на сдерживание России.\n\nВ ближайшее время последуют новые объявления о расширении санкционного «черного списка» за счет включения в него австралийских военных, бизнесменов, экспертов и медийных персон, которые способствуют разжиганию негативного отношения к нашей стране. Каждый антироссийский шаг – от введения новых персональных санкций до ограничения двусторонних экономических отношений, что наносит ущерб интересам самих австралийцев – получит решительный отпор.\n\nНиже следует список граждан Австралии, которые отныне являются невъездными в Российскую Федерацию.\n\n1        Скотт Моррисон (Scott Morrison)    премьер-министр\n\n2        Барнаби Джойс (Barnaby Joyce)       заместитель премьер-министра\n\n3        Карен Эндрюс (Karen Andrews)       министр внутренних дел\n\n4        Саймон Бирмингем (Simon Birmingham)   министр финансов\n\n5        Патрик Горман (Patrick Gorman)     депутат Палаты представителей\n\n6        Люк Гослинг (Luke Gosling)   депутат Палаты представителей\n\n7        Питер Даттон (Peter Dutton)   министр обороны\n\n8        Микаэлия Кэш (Michaelia Cash)       генеральный прокурор\n\n9        Мариз Пэйн (Marise Payne)     министр иностранных дел\n\n10      Джошуа Фрайденберг (Joshua Frydenberg)         