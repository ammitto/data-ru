    "content": {
      "ru": "\n21.06.2023 18:24\nЗаявление МИД России в связи с введением персональных санкций в отношении граждан Австралии\n\n1217-21-06-2023\n\nВ ответ на политически мотивированные санкции против российских физических и юридических лиц со стороны правительства Австралии, вводимые в рамках русофобской кампании «коллективного Запада», въезд в нашу страну на бессрочной основе закрывается дополнительно для 48 австралийцев из числа подрядчиков военно-промышленного комплекса, журналистов и муниципальных депутатов, формирующих в этой стране антироссийскую повестку дня.\n\nНиже следует поименный перечень:\n\n№ п/п\n\nИмя, фамилия\n\nИмя, фамилия на русском языке\n\nМесто работы/ Должность\n\n1\n\nJacinta Allan\n\nДжасинта Аллан\n\nзаместитель премьера правительства штата Виктория\n\n2\n\nLuke Aspinall\n\nЛюк Аспиналл\n\nменеджер полетных операций компании SYPAQ\n\n3\n\nAlan Ball\n\nАлан Болл\n\nчлен совета директоров\nвоенно-промышленного предприятия «Талес Аустрэлиа»\n\n4\n\nChad Barton\n\nЧэд Бартон\n\nглавный операционный директор\nи финансовый директор технологической компании Nuix\n\n5\n\nPhilippe Bernard-Flattot\n\nФилипп\nБернар-Флатто\n\nвице-президент\nпо военно-воздушным системам\nвоенно-промышленного предприятия\n«Талес Аустрэлиа»\n\n6\n\nJulie Bown\n\nДжули Боун\n\nвице-президент\nпо земельным вопросам\nвоенно-промышленного предприятия\n«Талес Аустрэлиа»\n\n7\n\nRonan Carolan\n\nРонан Кэролан\n\nвице-президент\nпо управлению персоналом\nвоенно-промышленного предприятия\n«Талес Аустрэлиа»\n\n8\n\nAnna Cheung\n\nАнна Чэнг\n\nчлен правления совета\nЮжной Австралии по проведению\nДня Австралии\n\n9\n\nCaroline Clough\n\nКэролайн Клаф\n\nруководитель по кадровым вопросам и корпоративной культуре компании SYPAQ\n\n10\n\nAntonietta Cocchiaro\n\nАнтониетта Коккиаро\n\nзаместитель председателя правления совета Южной Австралии\nпо проведению Дня Австралии\n\n11\n\nJeff Connolly\n\nДжефф Конноли\n\nдиректор странового отделения, исполнительный директор\nвоенно-промышле