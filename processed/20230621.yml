овета Южной Австралии по проведению Дня Австралии\n\n46\n\nDavid Vicino\n\nДэвид Вичино\n\nуправляющий директор\nкомпании SYPAQ\n\n47\n\nGeorge Vicino\n\nДжордж Вичино\n\nоснователь и председатель\nкомпании SYPAQ\n\n48\n\nDana Wortley\n\nДана Уортли\n\nчлен правления совета\nЮжной Австралии по проведению\nДня Австралии\n\n\n\nС учетом того, что официальная Канберра не намерена отказываться от антироссийского курса и продолжает вводить новые санкционные меры, работа над актуализацией российского «стоп-листа» будет продолжена.\n\n\n\n"
