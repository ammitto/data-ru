    "content": {
      "ru": "\n27.04.2022 13:06\nЗаявление МИД России об ответных персональных санкциях в отношении депутатов Палаты общин Парламента Великобритании\n\n918-27-04-2022\nВ ответ на принятое 11 марта с.г. правительством Великобритании решение о внесении в санкционный список 386 депутатов Государственной Думы Федерального Собрания Российской Федерации на основе взаимности вводятся персональные ограничения в отношении 287 членов Палаты общин британского парламента.\n\nУказанные лица, которым отныне закрыт въезд в Российскую Федерацию, принимали наиболее активное участие в учреждении антироссийских санкционных инструментов Лондона, способствуют безосновательному нагнетанию русофобской истерии в Великобритании.\n\nВраждебная риторика и надуманные обвинения, звучащие из уст британских парламентариев, не только потворствуют враждебному курсу Лондона, нацеленному на демонизацию нашей страны и ее международную изоляцию, но и используются противниками взаимоуважительного диалога с Россией для подрыва фундамента двустороннего сотрудничества.\n\nНиже следует поименный список британских парламентариев:\n\nЧлены фракции Консервативной партии в Палате общин Парламента Великобритании\n\nСтивен Пол БАРКЛИ (Stephen Paul BARCLAY),\nДэвид Майкл ДЭВИС (David Michael DAVIS),\nЧарльз Джордж ЮСТИС (Charles George EUSTICE),\nДоминик Чарльз ГРИВ (Dominic Charles GRIEVE),\nКристофер ХИТОН-ХАРРИС (Christopher HEATON-HARRIS),\nДжереми Ричард Стреншам ХАНТ (Jeremy Richard Streynsham HUNT),\n Алистер Уильям Джек (Alister William JACK),\n Даниэль Роберт КАВЧИНСКИЙ (Daniel Robert KAWCZYNSKI),\n Андреа Жаклин ЛЕДСОМ (Andrea Jacqueline LEADSOM),\n Джулиан Мюррей ЛЬЮИС (Julian Murray LEWIS),\n Эстер Луиза МАКВЕЙ (Esther Louise MCVEY),\n Пенелопа Мери МОРДОНТ (Penelope Mary MORDAUNT),\n Кэролайн Фиона Эллен НОУКС (Caroline Fiona Ellen NOKES),\nКристофер Джон ПИНЧЕР (Christopher John PINCHER),\n Джейкоб Уильям РИС-МОГГ (Jacob William REES-MOGG),\n Марк Стивен СПЕНСЕР (Mark Steven SPENCER),\nТереза Энн ВИЛ