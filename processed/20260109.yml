    "title": {
      "ru": "Заявление МИД России о введении персональных контрсанкций в отношении ряда граждан Канады"
    },
    "url": "https://mid.ru/en/foreign_policy/news/2071436/",
    "lang": "ru",
    "publish_date": "2026-01-05",
    "publish_time": "17:52",
    "content": {
      "ru": "\n05.01.2026 17:52\nЗаявление МИД России о введении персональных контрсанкций в отношении ряда граждан Канады\n\n9-05-01-2026\n\nВ ответ на объявлявшиеся ранее официальной Оттавой неправомерные антироссийские ограничения въезд в Россию закрывается на постоянной основе для 28 канадских граждан, деятельность которых в структурах и организациях пробандеровского толка направлена на продвижение преступной неонацистской идеологии, ныне проповедуемой киевским режимом.\n\nДанные лица, игнорируя исторические факты и правду о событиях Великой Отечественной войны, силятся упрочить связку Канады с наиболее радикальными и непримиримыми националистическими силами на Украине. Дополнительным подтверждением этой тенденции стало сегодняшнее назначение бывшей министра иностранных дел и вице-премьера Канады Христи Фриланд, внучки гитлеровского приспешника Михайло Хомяка, на должность советника В.Зеленского по вопросам экономического развития «Незалежной». Киевская клика, отдавая дань оголтелой укронацистской общине Канады, пошла на это кадровое решение, обеляя тем самым преступления украинских нацистов из 14-й дивизии СС «Галичина», подразделений Шуцманшафт СС, «Нахтигаль» и других.\n\nРоссия последовательно выступает против любых проявлений экстремизма и ксенофобии, и будет продолжать принимать меры по защите своих государственных интересов и исторической правды.\n\nНиже следует поименный перечень лиц, пополнивших российский «стоп-лист»:\n\n1. Роберт Бэйнс (Robert Charles Jeffrys Bainess) – руководитель канадской Ассоциации НАТО;\n\n2. Виктория Карпяк (Victoria Karpiak) – член Совета директоров «Украинского национального фонда» (Ukranian National Foundation);\n\n3. Стефания Романюк (Stephania Romaniuk) – активистка Канадского украинского конгресса;\n\n4. Лариса Заричняк (Larisa Zariczniak) – президент Украинской молодежной ассоциации (г.Гамильтон, провинция Онтарио);\n\n5. Марта Базюк (Marta Baziuk) – исполнительный директор «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты;\n\n6. Богдан Клид (Bohdan Klid) – директор по исследованиям «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты;\n\n7. София Исайив (Sophia Isajiw) – научный сотрудник «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты;\n\n8. Валентина Курылив (Valentina Kuryliw) – директор по преподаванию «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты;\n\n9. Оксана Винник (Oksana Vinnik) – научный сотрудник «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты;\n\n10. Ольга Клименко (Olga Klimenko) – научный сотрудник «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты;\n\n11. Уильям Пиджамецки (William Pidzamecky) – научный сотрудник «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты;\n\n12. Ольга Андриевски (Olga Andriewsky) – член научно-консультативного комитета «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты, профессор Университета Трента;\n\n13. Пол Роберт Магочи (Paul Robert Magocsi) – член научно-консультативного комитета «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты, профессор Университета Торонто;\n\n14. Линн Виола (Lynne Viola) – член научно-консультативного комитета «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты, профессор Университета Торонто;\n\n15. Оленка Билаш (Olenka S.E.Bilash) – член консультативного комитета по преподаванию «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты;\n\n16. Орест Чап (Orest Сар) – член консультативного комитета по преподаванию «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты, профессор Университета Манитобы;\n\n17. Денис Глинка (Denis Hlynka) – член консультативного комитета по преподаванию «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты, профессор Университета Манитобы;\n\n18. Марк Мельник (Mark Melnyk) – член консультативного комитета по преподаванию «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты;\n\n19. Валентина Ноузворси (Valentina Noseworthy) – член консультативного комитета по преподаванию «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты;\n\n20. Борис Радио (Boris Radyo) – член консультативного комитета по преподаванию «Консорциума по вопросам исследования и преподавания голодомора» (The Holodomor Research and Education Consortium, HREC) при Канадском институте украинских исследований Университета Альберты;\n\n21. Марта Иванек (Marta Iwanek) – организатор проекта «Принт фор Юкрейн» (Print 4 Ukraine) по сбору средств в поддержку киевского режима;\n\n22. Кейлер Зелены (Kyler Zeleny) – организатор проекта «Принт фор Юкрейн» (Print 4 Ukraine) по сбору средств в поддержку киевского режима;\n\n23. Эндрю Кушнир (Andrew Kushnir) – актер, сценарист, основатель фонда «Ви саппорт Эл-Джи-Би-Ти-Кью Юкрейн» (We Support LGBTQ Ukraine);\n\n24. Анатолий Груздь (Anatoliy Gruzd) – профессор факультета управления Университета Метрополитан в Торонто, директор по исследованиям лаборатории социальных сетей, куратор портала «Раша-Юкрейн КонфликтМизинфо Peceч» (Russia-Ukraine ConflictMisinfo Research);\n\n25. Филип Май (Philip Mai) – старший исследователь лаборатории социальных сетей Университета Метрополитан в Торонто, куратор портала «Раша-Юкрейн КонфликтМизинфо Peceч» (Russia-Ukraine ConflictMisinfo Research);\n\n26. Джулия Заритски (Julia Zaritsky) – президент «Секонд фронт Юкрейн фаундейшн» (Second Front Ukraine Foundation), спонсор ВСУ;\n\n27. Светлана Нечипоренко (Svetlana Nechyporenko) – секретарь «Секонд фронт Юкрейн фаундейшн» (Second Front Ukraine Foundation);\n\n28. Вальтер/Володимир Киш (Walter/Volodymyr Kish) – журналист, корреспондент газеты «Новый шлях» (New Pathway).\n\n"
